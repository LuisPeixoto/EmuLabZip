[package]
name = "emulabzip-desktop"
description = "EmuLabZip desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "emulabzip_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "emulabzip-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64.workspace = true
emulabzip-android.workspace = true
emulabzip-apple.workspace = true
emulabzip-core.workspace = true
emulabzip-net.workspace = true
emulabzip-storage.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
flate2.workspace = true
