# Example rule scripts for EmuLabZip, written in Rust and built for WebAssembly. They are not part of the main workspace.
#
#   cd tools/rule-scripts && ./build.sh
#
# See docs/rule-scripts.md for the interface a script has to follow.
[workspace]
members = ["sdk", "add-header", "redact-json", "flaky"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
codegen-units = 1
