[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LuisPeixoto/EmuLabZip"
homepage = "https://github.com/LuisPeixoto/EmuLabZip"
readme = "README.md"
authors = ["Luis Peixoto"]
rust-version = "1.90"

[workspace.dependencies]
emulabzip-core = { path = "crates/emulabzip-core" }
emulabzip-adb = { path = "crates/emulabzip-adb" }
emulabzip-android = { path = "crates/emulabzip-android" }
emulabzip-apple = { path = "crates/emulabzip-apple" }

anyhow = "1"
base64 = "0.22"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
parking_lot = "0.12"
owo-colors = { version = "4", features = ["supports-colors"] }
regex = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
