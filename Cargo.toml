[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LuisPeixoto/EmuLabZip"
homepage = "https://github.com/LuisPeixoto/EmuLabZip"
readme = "README.md"
authors = ["Luis Peixoto"]
rust-version = "1.90"

[workspace.dependencies]
emulabzip-core = { path = "crates/emulabzip-core" }
emulabzip-adb = { path = "crates/emulabzip-adb" }
emulabzip-android = { path = "crates/emulabzip-android" }
emulabzip-apple = { path = "crates/emulabzip-apple" }
emulabzip-storage = { path = "crates/emulabzip-storage" }
emulabzip-net = { path = "crates/emulabzip-net" }
emulabzip-trace = { path = "crates/emulabzip-trace" }
emulabzip-mcp = { path = "crates/emulabzip-mcp" }

anyhow = "1"
base64 = "0.23"
brotli = "8"
bytes = "1"
dirs = "6"
flate2 = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["server-auto", "client-legacy", "tokio", "http1", "http2"] }
lru = "0.16"
md-5 = "0.10"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
time = { version = "0.3", features = ["formatting"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
x509-parser = "0.18"
zstd = "0.13"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
parking_lot = "0.12"
plist = "1"
prost = "0.14"
roxmltree = "0.21"
rmcp = { version = "3.7", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
owo-colors = { version = "4", features = ["supports-colors"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
