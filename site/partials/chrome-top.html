<header class="top" id="top">
  <div class="wrap bar">
    <a class="brand" href="{{page.home}}">
      <img src="{{img.logo_svg}}" alt="EmuLabZip logo" width="32" height="32">
      <span>EmuLabZip</span>
    </a>
    <nav class="links" aria-label="{{nav.label}}">
      <a href="{{page.docsHome}}">{{nav.docs}}</a>
      <a href="{{page.home}}#features">{{nav.features}}</a>
      <a href="{{page.home}}#showcase">{{nav.showcase}}</a>
      <a href="{{page.home}}#cli">{{nav.cli}}</a>
      <a href="{{page.home}}#ai">{{nav.ai}}</a>
      <a href="{{page.home}}#roadmap">{{nav.roadmap}}</a>
      <a href="{{page.home}}#faq">{{nav.faq}}</a>
    </nav>
    <div class="tools">
      <details class="lang">
        <summary><svg class="ico" aria-hidden="true"><use href="#i-globe"/></svg><span class="sr">{{nav.language}}:</span><span>{{nav.current}}</span></summary>
        <ul>
          {{#each switcher}}<li><a href="{{href}}" hreflang="{{hreflang}}" lang="{{lang}}"{{{current}}}>{{label}}</a></li>{{/each}}
        </ul>
      </details>
      <a class="btn ghost sm" href="{{site.repo}}" rel="noopener" aria-label="{{nav.github}}"><svg class="ico" aria-hidden="true"><use href="#i-github"/></svg><span>{{nav.github}}</span></a>
    </div>
  </div>
</header>
